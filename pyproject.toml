[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baldessari"
version = "0.1.0"
description = "Helpers for querying the CPS Wikibase, Wikidata and the DNB for the Baldessari Quarto book."
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
baldessari = ["queries/*.rq"]
